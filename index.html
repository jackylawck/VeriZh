  <meta name="twitter:card" content="summary">

  <!-- 📱 PWA 與網站圖示設定 (消滅 404 紅字) -->
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" sizes="192x192" href="./VeriZh192icon.png">
  <link rel="apple-touch-icon" href="./VeriZh192icon.png">

  <!-- 🛡️ 企業級安全策略：嚴格 CSP 規範 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">

  <!-- 🎨 樣式表已抽離以符合 CSP 安全規範 -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <header>
    <div class="header-text">
      <h1>VeriZh 字準</h1>
      <div class="subtitle">本地運算、隱私優先、可審計的文字校對工具</div>
    </div>
    <!-- 讓使用者一鍵加入手機畫面的按鈕 -->
    <button id="installBtn">📲 加到手機主畫面</button>
  </header>

  <div class="controls">
    <select id="conversionMode" aria-label="選擇轉換模式">
      <option value="s2hk">簡體 ➔ 香港繁體 (字形轉換 + 企業術語)</option>
      <option value="hk2s">香港繁體 ➔ 簡體 (純字形轉換)</option>
      <option value="s2twp">簡體 ➔ 台灣正體 (字形轉換 + 內建地區詞彙)</option>
      <option value="tw2sp">台灣正體 ➔ 簡體 (字形轉換 + 大陸詞彙)</option>
    </select>
    
    <span class="subtitle" id="statusIndicator" role="status" aria-live="polite">⏳ 載入企業術語庫中...</span>
  </div>

  <div id="warningBanner" role="alert" aria-live="assertive"></div>

  <div class="workspace">
    <div class="panel">
      <div class="panel-header">
        <span>輸入文本 (本地處理)</span>
      </div>
      <textarea id="sourceText" aria-label="輸入要轉換的文字" placeholder="在此貼上或拖曳純文字檔案 (.txt, .md, .csv) ..."></textarea>
    </div>
    
    <div class="panel">
      <div class="panel-header">
        <span>轉換結果</span>
        <button id="copyBtn" aria-label="複製結果">複製</button>
      </div>
      <textarea id="targetText" aria-label="轉換結果" readonly placeholder="轉換結果將顯示於此..."></textarea>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
